; ---------------------------------------------------------------------------
; Air Quality Monitor firmware - Arduino Nano ESP32 (ESP32-S3)
;
; This is the real build definition. CLion drives it through the PlatformIO
; plugin; CMakeLists.txt in this folder exists only so CLion has something to
; open and index. See README.md.
;
; Everything here mirrors what the Arduino IDE was doing:
;   Board            : Arduino Nano ESP32          -> board = arduino_nano_esp32
;   Port monitor baud: 115200                      -> monitor_speed
;   Libraries from   : Library Manager             -> lib_deps (pinned by git URL)
; ---------------------------------------------------------------------------

[platformio]
default_envs = arduino_nano_esp32
description = BioBot air-quality monitor firmware (BME688/BSEC2 + BMV080 + AS3935 + Notecard)

[env:arduino_nano_esp32]
platform = espressif32@^6.9.0
board = arduino_nano_esp32
framework = arduino

; Match the Arduino IDE's Serial Monitor. esp32_exception_decoder turns a
; panic backtrace into file:line, which the Arduino IDE never did for you.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The Nano ESP32 has no separate UART bridge - Serial is USB CDC. The board
; definition already sets this; repeating it makes the dependency explicit and
; is harmless (identical value).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Only compile our own sources; nothing to exclude, but keeping the src filter
; explicit avoids surprises if scratch files land in src/.
build_src_filter = +<*.cpp>

; ---------------------------------------------------------------------------
; Libraries.
;
; Git URLs rather than registry names: these are the exact upstream repos the
; Arduino Library Manager installs from, so there is no ambiguity about which
; package you get, and Bosch's BSEC2 in particular is not consistently mirrored
; in the PlatformIO registry.
;
; To pin a version (recommended once the build is known good), append a tag:
;   https://github.com/blues/note-arduino.git#v1.6.5
; `pio pkg list` prints the resolved versions currently in .pio/libdeps.
; ---------------------------------------------------------------------------
lib_deps =
    ; BME688 + Bosch BSEC2 algorithm. BSEC2 depends on the BME68x driver;
    ; listed explicitly because the LDF does not always resolve a
    ; library.properties `depends=` entry through a git dependency.
    https://github.com/boschsensortec/Bosch-BME68x-Library.git
    https://github.com/boschsensortec/Bosch-BSEC2-Library.git

    ; BMV080 particulate sensor (needs SparkFun's Toolkit base library).
    ;
    ; The SparkFun wrapper itself is NOT listed here - it is vendored into
    ; lib/SparkFun_BMV080_Arduino_Library/, which PlatformIO picks up
    ; automatically and which takes priority over lib_deps. It has to be
    ; vendored because the wrapper is useless without Bosch's closed-source
    ; BMV080 SDK (sfTk/bmv080.h, sfTk/bmv080_defs.h and the per-architecture
    ; lib_bmv080.a / lib_postProcessor.a), which SparkFun cannot redistribute
    ; and so is absent from the public git repo. See README.md.
    https://github.com/sparkfun/SparkFun_Toolkit.git

    ; AS3935 lightning detector
    https://github.com/sparkfun/SparkFun_AS3935_Lightning_Detector_Arduino_Library.git

    ; Blues Notecard
    https://github.com/blues/note-arduino.git

; The Nano ESP32 ships an Arduino DFU bootloader and PlatformIO's board
; definition uses it by default (double-tap RESET puts the board in DFU if the
; auto 1200bps touch doesn't take). If uploads misbehave, force one:
;   upload_protocol = dfu
;   upload_protocol = esptool
; and pin the port explicitly if you have several boards attached:
;   upload_port = /dev/cu.usbmodem*
;   monitor_port = /dev/cu.usbmodem*
